services:
  webhook-apps:
    container_name: webhook-apps
    image: ghcr.io/kth-biblioteket/webhook-apps:main
    restart: always
    env_file:
      - .env
    # Traefik labels - används för att konfigurera proxy och cert via Let's Encrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webhook-apps.rule=Host(`${HOST}`) && PathPrefix(`${PATHPREFIX}`)"
      - "traefik.http.routers.webhook-apps.middlewares=webhook-apps-stripprefix"
      - "traefik.http.middlewares.webhook-apps-stripprefix.stripprefix.prefixes=${PATHPREFIX}"
      - "traefik.http.routers.webhook-apps.entrypoints=websecure"
      - "traefik.http.routers.webhook-apps.tls=true"
      - "traefik.http.routers.webhook-apps.tls.certresolver=myresolver"
    # Monterade volymer - ger containern tillgång till hostens filer/system
    volumes:
      # Docker socket - gör att containern kan styra Docker på värden
      # Behövs för att webhooken ska kunna köra docker commands
      - /var/run/docker.sock:/var/run/docker.sock
      
      # Docker compose-filer - read-only (ro)
      # Webhooken läser compose-filer från denna mapp för deployment
      - /local/docker:/docker:ro
    networks:
      - apps-net
    # Lägg till healthcheck för bättre övervakning
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${WEBHOOK_PORT}/hook"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  apps-net:
    external: true